# Railway service config for the Next.js web app.
# Dashboard → Settings → Deploy can mirror these if the file is ignored.

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
preDeployCommand = "npm run db:railway"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
