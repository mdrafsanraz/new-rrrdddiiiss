# Use Railpack (not Dockerfile). Railway always prefers a root Dockerfile if one exists.
# Optional Docker build: Dockerfile.optional (set dockerfile path manually if needed).

[build]
builder = "RAILPACK"
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
