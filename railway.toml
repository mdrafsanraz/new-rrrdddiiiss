# Railway: use Nixpacks (not Dockerfile) so `npm start` has full node_modules/Prisma.
# Optional container build: see Dockerfile.optional

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
