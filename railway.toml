# Railway service config for the Next.js web app.

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
# No pre-deploy migrate. Schema is applied on start via `prisma db push`.
startCommand = "npm start"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
